# Configuração usada só pelos testes automáticos (mvnw test).
# Substitui o application.properties principal: os testes continuam num H2 em memória,
# então não precisam do PostgreSQL nem da senha local.
spring.application.name=simba-backend-teste

spring.datasource.url=jdbc:h2:mem:simba;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Chave só de teste (nunca usar fora dos testes)
jwt.secret=chave-somente-para-testes-automaticos-do-simba-0123456789

simba.login.max-falhas=5
simba.login.janela-minutos=15
simba.cadastro.max-por-hora=1000
