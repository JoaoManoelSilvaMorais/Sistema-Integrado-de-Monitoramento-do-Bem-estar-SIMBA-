# Modelo das configurações locais do SIMBA.
# Copie este arquivo para config/simba-local.properties (esse NÃO vai para o git) e preencha.

# PostgreSQL da sua máquina
DB_URL=jdbc:postgresql://localhost:5432/simba
DB_USER=postgres
DB_PASSWORD=coloque-aqui-a-senha-do-postgres

# Chave que assina os logins (JWT): uma frase/sequência aleatória com 32 caracteres ou mais.
# Gere uma no PowerShell:  [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))
JWT_SECRET=troque-por-uma-chave-aleatoria-com-32-caracteres-ou-mais
