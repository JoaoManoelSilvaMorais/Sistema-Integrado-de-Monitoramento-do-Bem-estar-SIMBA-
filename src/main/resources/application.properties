spring.application.name=simba-backend

# ---------------------------------------------------------------------------------------------
# Senhas e chaves NÃO ficam aqui (este arquivo vai para o GitHub).
# Na sua máquina elas ficam em config/simba-local.properties (fora do git; modelo em
# config/simba-local.example.properties). Num servidor, use variáveis de ambiente:
#   DB_URL, DB_USER, DB_PASSWORD e JWT_SECRET  (elas valem mais que o arquivo local).
# ---------------------------------------------------------------------------------------------
spring.config.import=optional:file:./config/simba-local.properties

# Banco: PostgreSQL (os dados ficam guardados mesmo reiniciando o app)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simba}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Console web do H2 desligado (o H2 só é usado nos testes automáticos)
spring.h2.console.enabled=false

# SQL no log: desligado. Para depurar na sua máquina: SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# Chave que assina os logins (JWT). Obrigatória: o app não inicia sem ela (mín. 32 caracteres).
jwt.secret=${JWT_SECRET:}

# Limite de tentativas (login e cadastro) — ver security/LimiteTentativas.java
simba.login.max-falhas=5
simba.login.janela-minutos=15
simba.cadastro.max-por-hora=10
