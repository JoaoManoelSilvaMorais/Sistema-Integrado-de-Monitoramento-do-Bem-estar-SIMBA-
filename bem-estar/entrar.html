<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simba - Entrar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
 
        body {
            background-image: url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8%;
        }

        .glass-panel {
            background: rgba(230, 220, 210, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #0f2b1d;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #123d29;
        }

        .logo-img {
            max-height: 60px; 
            width: auto;
            object-fit: contain; 
        }
        
        .logo-area i {
            font-size: 24px;
        }

        .logo-area h2 {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .glass-panel h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .glass-panel p.subtitle {
            font-size: 13px;
            color: #333;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
            font-size: 14px;
            pointer-events: none; 
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px; 
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #111;
            outline: none;
            transition: border 0.3s ease;
        }

        .input-group input::placeholder {
            color: #444;
        }

        .input-group input:focus {
            border-color: #1aa362;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            transition: color 0.2s ease;
        }

        .btn-toggle-password:hover,
        .btn-toggle-password:focus {
            color: #1aa362;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #1aa362;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 25px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #158750;
        }

        .login-link {
            font-size: 13px;
            color: #333;
        }

        .login-link a {
            color: #123d29;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding: 20px;
            }
            .glass-panel {
                padding: 30px 20px;
            }
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 4px solid #e74c3c; 
            color: #0f2b1d;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            transform: translateX(120%); 
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast i {
            font-size: 20px;
            color: #e74c3c;
        }

    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="logo-area">
            <img src="img\LeaoLogoPNG.png" alt="Leao Logo" class="logo-img">
            <img src="img\NomeLogoPNG.png" alt="Nome Simba" class="logo-img">
            <h2 class="sr-only">SIMBA</h2>
        </div>
        
        <h1>Entrar</h1>
        <p class="subtitle">Acesse sua conta para continuar.</p>

        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="username" class="sr-only">Nome de usuário</label>
                <i class="fa-regular fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="senha" class="sr-only">Senha</label>
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
                <button type="button" class="btn-toggle-password" aria-label="Mostrar senha" title="Mostrar senha">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="btn-submit">ENTRAR</button>
        </form>

        <p class="login-link">Não tem uma conta? <a href="login.html">Criar</a></p>
    </div>

    <script>
        const togglePasswordButtons = document.querySelectorAll('.btn-toggle-password');

        togglePasswordButtons.forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash'); 
                    this.setAttribute('aria-label', 'Ocultar senha');
                    this.setAttribute('title', 'Ocultar senha');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye'); 
                    this.setAttribute('aria-label', 'Mostrar senha');
                    this.setAttribute('title', 'Mostrar senha');
                }
            });
        });
             
        function showToast(mensagem) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${mensagem}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        const formLogin = document.querySelector('form');

        formLogin.addEventListener('submit', function(event) {
            event.preventDefault(); 

            const usernameDigitado = document.getElementById('username').value;
            const senhaDigitada = document.getElementById('senha').value;

            fetch('usuarios.json')
                .then(response => response.json())
                .then(usuariosDB => {
                    const usuarioEncontrado = usuariosDB.find(user => user.username === usernameDigitado);

                    if (!usuarioEncontrado) {
                        showToast("Username não localizado.");
                    } else if (usuarioEncontrado.senha !== senhaDigitada) {
                        showToast("Senha divergente. Verifique seus dados.");
                    } else {
                        alert("Login efetuado com sucesso!");
                    }
                })
                .catch(error => {
                    console.error("Erro ao buscar dados:", error);
                    showToast("Erro ao conectar com o banco de testes.");
                });
        });
    </script>
</body>
</html>
